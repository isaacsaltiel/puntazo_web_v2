<!-- Guardia de arranque: si la pagina no termina de cargar (red lenta, red
     que filtra, proxy roto), en vez de dejar la pantalla en blanco muestra
     un aviso con boton de reintento. Va inline y antes que todo lo demas. -->
<script id="pz-boot-guard">
(function () {
  var TIMEOUT_MS = 20000;
  var shown = false;
  function box() {
    if (shown || window.__pzBooted) return;
    shown = true;
    var root = document.body || document.documentElement;
    if (!root) return;
    var d = document.createElement("div");
    d.id = "pz-boot-guard-box";
    d.setAttribute("style", [
      "position:fixed", "inset:0", "z-index:2147483647",
      "background:#050914", "color:#fff",
      "font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif",
      "display:flex", "flex-direction:column",
      "align-items:center", "justify-content:center",
      "text-align:center", "padding:24px", "gap:14px"
    ].join(";"));
    d.innerHTML =
      '<div style="font-size:44px;line-height:1">\uD83C\uDFBE</div>' +
      '<div style="font-size:19px;font-weight:800">La conexi\u00F3n est\u00E1 tardando</div>' +
      '<div style="font-size:14px;opacity:.75;max-width:22em;line-height:1.5">' +
      'No pudimos cargar Puntazo con esta red. Prueba con datos m\u00F3viles ' +
      'o con otra red Wi-Fi.</div>' +
      '<button type="button" id="pz-boot-guard-retry" style="margin-top:6px;' +
      'background:#0B7CFF;color:#fff;border:0;border-radius:999px;' +
      'padding:13px 30px;font-size:15px;font-weight:800;cursor:pointer">' +
      'Reintentar</button>';
    root.appendChild(d);
    var b = document.getElementById("pz-boot-guard-retry");
    if (b) b.addEventListener("click", function () { location.reload(); });
  }
  function booted() {
    window.__pzBooted = true;
    var d = document.getElementById("pz-boot-guard-box");
    if (d && d.parentNode) d.parentNode.removeChild(d);
  }
  setTimeout(box, TIMEOUT_MS);
  document.addEventListener("DOMContentLoaded", booted);
  window.addEventListener("load", booted);
})();
</script>

<script>
(async function () {
  'use strict';

  // URL del índice global — construido por generar_stats.py
  const INDEX_URL = '/data/videos_index.json';

  const params  = new URLSearchParams(location.search);
  const videoId = params.get('videoId') || params.get('v') || '';

  const $breadcrumb   = document.getElementById('clipBreadcrumb');
  const $loading      = document.getElementById('clipLoading');
  const $card         = document.getElementById('clipCard');
  const $error        = document.getElementById('clipError');
  const $footer       = document.getElementById('clipFooter');

  function showError() { $loading.style.display='none'; $error.style.display='block'; }

  if (!videoId) { showError(); return; }

  // Esperar a que las deps estén disponibles
  async function waitFor(check, retries) {
    for (let i=0; i<(retries||40); i++) {
      if (check()) return true;
      await new Promise(r=>setTimeout(r,200));
    }
    return false;
  }

  const ready = await waitFor(()=> window.PuntazoCard && window.PuntazoFirebase?.db, 40);
  if (!ready) { showError(); return; }

  // ── 1. Buscar en el índice global ──────────────────────────
  let entry = null;

  try {
    const res = await fetch(INDEX_URL + '?cb=' + Date.now(), { cache: 'no-store' });
    if (res.ok) {
      const idx = await res.json();
      const hit = idx?.videos?.[videoId];
      if (hit && hit.url) {
        entry = {
          nombre:  videoId,
          url:     hit.url,
          club:    hit.club    || '',
          cancha:  hit.cancha  || '',
          lado:    hit.lado    || '',
          fecha:   hit.fecha   || '',
          _meta:   PuntazoCard.parseFromName(videoId),
          _ladoHref: hit.loc_id
            ? `/lado.html?loc=${encodeURIComponent(hit.loc_id)}&can=${encodeURIComponent(hit.can_id)}&lado=${encodeURIComponent(hit.lado_id)}`
            : null,
          _canchaHref: hit.loc_id
            ? `/cancha.html?loc=${encodeURIComponent(hit.loc_id)}&can=${encodeURIComponent(hit.can_id)}`
            : null,
        };
      }
    }
  } catch (e) {
    console.warn('[clip] videos_index.json no disponible:', e);
  }

  // (2026-09-28) Respaldo: el índice global solo guarda 14 días y se regenera
  // por CI; si el clip no está, lo buscamos en el índice de su cancha (el
  // mismo que usa lado.html), sacando club/cancha/lado del nombre del archivo.
  const _m = PuntazoCard.parseFromName(videoId);
  const _ctxClip = _m ? { loc: _m.loc, can: _m.can, lado: _m.lado || 'LadoA' } : null;
  if ((!entry || !entry.url) && _ctxClip && window.PuntazoContext) {
    try {
      const lista = await PuntazoContext.fetchClips(_ctxClip);
      const hit = lista.find(x => x.nombre === videoId);
      if (hit) {
        const n = await PuntazoContext.names(_ctxClip);
        entry = {
          nombre: videoId, url: hit.url, club: n.club, cancha: n.cancha, lado: _ctxClip.lado, fecha: '',
          _meta: _m,
          _ladoHref: `/lado.html?loc=${encodeURIComponent(_ctxClip.loc)}&can=${encodeURIComponent(_ctxClip.can)}&lado=${encodeURIComponent(_ctxClip.lado)}`,
          _canchaHref: null,
        };
      }
    } catch (e) { console.warn('[clip] respaldo por cancha:', e); }
  }

  // ── 2. No encontrado ────────────────────────────────────────
  if (!entry || !entry.url) { showError(); return; }

  // ── 3. Render ────────────────────────────────────────────────
  document.title = `${entry.club || 'Puntazo'} · Clip`;

  // (2026-09-28) Encabezado: "BreakPoint · Cancha 2" + "Hoy · 9:42 PM".
  // La hora es lo que identifica el clip, así que manda.
  const C = window.PuntazoContext;
  const _date = C && C.dateFromName(videoId);
  const _names = (C && _ctxClip) ? await C.names(_ctxClip) : { club: entry.club, cancha: entry.cancha };
  document.getElementById('clipWhere').textContent = [_names.club || entry.club, _names.cancha || entry.cancha].filter(Boolean).join(' · ');
  if (_date) document.getElementById('clipWhen').innerHTML = '<span>' + C.diaLabel(_date) + ' ·</span>' + C.horaLabel(_date);
  document.getElementById('clipHead').style.display = 'block';
  // Si el jugador todavía no tiene cancha elegida, la del clip se vuelve su contexto.
  if (C && _ctxClip && !C.get()) C.set(_ctxClip.loc, _ctxClip.can, _ctxClip.lado);

  const card = PuntazoCard.build(entry, {
    showSave:true, showShare:true, showFullscreen:true,
    topLabel: _date ? '' : PuntazoCard.formatDisplayTime(entry.nombre),
    // Esta es la pagina de un clip compartido: un solo video, atencion
    // completa, y suele abrirse desde WhatsApp por gente que no usa Puntazo.
    // Es el mejor lugar del sitio para el patrocinador.
    showSponsor:true, sponsorSlot:'clip_page',
  });

  $loading.style.display = 'none';
  $card.appendChild(card);

  // Botón "Editar clip" (recorte + encuadre dinámico) — solo clubs cuya NUC
  // sabe renderizar la edición.
  try {
    const editLoc = (entry._meta && entry._meta.loc) || '';
    if (window.PuntazoPulses && PuntazoPulses.canEditClip && PuntazoPulses.canEditClip(editLoc)) {
      const ed = document.createElement('a');
      ed.href = '/editor.html?videoId=' + encodeURIComponent(videoId) +
                '&src=' + encodeURIComponent(entry.url);
      ed.textContent = '✂️ Editar clip';
      ed.style.cssText = 'display:block;text-align:center;margin:14px auto 0;max-width:420px;' +
        'padding:12px 16px;border-radius:12px;background:#EA5B0C;color:#fff;font-weight:700;' +
        'text-decoration:none;font-family:inherit;';
      $card.appendChild(ed);
    }
  } catch (_) {}

  // Footer
  const footerClub = document.getElementById('clipFooterClub');
  const footerLink = document.getElementById('clipFooterLink');
  if (footerClub && entry.club) footerClub.textContent = entry.club;
  if (footerLink && (entry._canchaHref || entry._ladoHref))
    footerLink.href = entry._canchaHref || entry._ladoHref;
  $footer.style.display = 'flex';

  // ── Más clips de esta cancha (seguir navegando sin volver a la lista) ──
  if (C && _ctxClip && !(await C.isLocked(_ctxClip.loc, _ctxClip.can))) {
    try {
      const lista = await C.fetchClips(_ctxClip);
      const i = lista.findIndex(x => x.nombre === videoId);
      // Ventana alrededor del clip actual (los más cercanos en el tiempo).
      const desde = Math.max(0, (i < 0 ? 0 : i) - 3);
      const vecinos = lista.slice(desde, desde + 8);
      if (vecinos.length > 1) {
        const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        document.getElementById('moreList').innerHTML = vecinos.map(x =>
          `<a class="more-item${x.nombre === videoId ? ' is-current' : ''}" href="/clip.html?v=${encodeURIComponent(x.nombre)}">` +
            `<span class="more-thumb"${x.poster ? ` style="background-image:url(&quot;${esc(x.poster)}&quot;)"` : ''}></span>` +
            `<span><span class="more-time">${C.horaLabel(x.date)}</span><br><span class="more-day">${esc(C.diaLabel(x.date))}</span>` +
            `${x.nombre === videoId ? '<br><span class="more-now">▶ Viendo ahora</span>' : ''}</span></a>`
        ).join('');
        document.getElementById('moreAll').href = entry._ladoHref || '#';
        // Quien abre un clip compartido: puerta directa a los clips de ese club.
        const _club = _names.club || entry.club;
        if (_club) {
          const cta = document.createElement('a');
          cta.className = 'btn-more-clips';
          cta.style.cssText = 'display:flex;justify-content:center;margin-top:14px;';
          cta.href = '/inicio.html?loc=' + encodeURIComponent(_ctxClip.loc);
          cta.textContent = '¿Juegas en ' + _club + '? Ver los clips del club →';
          document.getElementById('moreClips').appendChild(cta);
        }
        document.getElementById('moreClips').style.display = 'block';
        $footer.style.display = 'none';
      }
    } catch (e) { console.warn('[clip] más clips:', e); }
  }
})();
</script>
