name: Regenerar páginas SEO

# Una vez por semana regenera las páginas de contenido (tools/seo/build.py)
# para que las cifras reales (clips publicados, clips en 30 días, canchas)
# y el sitemap se mantengan al día. Si algo cambió, hace commit y el
# workflow de IndexNow avisa a los buscadores.
on:
  schedule:
    - cron: "0 12 * * 1"   # lunes 6:00 hora de CDMX
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet markdown pyyaml pillow
      - run: python tools/seo/build.py --check
      - name: "Commit y push (con reintentos, el CI de clips también escribe en master)"
        run: |
          git config user.name  "puntazo-seo-bot"
          git config user.email "puntazoclips@gmail.com"
          git add -A -- '*.html' sitemap.xml llms.txt llms-full.txt assets/og tools/seo/og_sig
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "[seo] Regenerar páginas con cifras al día"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin master && git push origin HEAD:master; then
              echo "pushed=1" >> "$GITHUB_ENV"; exit 0
            fi
            sleep 10
          done
          exit 1
      # Un push hecho con GITHUB_TOKEN no dispara otros workflows, así que el
      # aviso a IndexNow va aquí mismo (después de que Pages publique).
      - if: env.pushed == '1'
        run: sleep 120 && python tools/seo/indexnow.py
