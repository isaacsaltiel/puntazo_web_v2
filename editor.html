<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<title>Recortar clip · Puntazo</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#05070d" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/favicon.ico" />
<!--
  (2026-10-01) EDITOR NUEVO de clips — todo en el teléfono, sin cola.
  - Recorta el clip en el navegador con Mediabunny (/assets/lib/mediabunny,
    MPL-2.0) SIN recodificar: solo baja el tramo elegido (lectura por rangos
    del host directo de Dropbox) y copia los cuadros tal cual.
  - El inicio del corte cae en un cuadro clave (uno cada ~2 s): la selección
    visible se ajusta a esos cuadros, así lo que se ve es lo que sale.
  - Parámetros: ?v=<nombre.mp4> (o videoId= legado) · src= opcional (URL del
    clip; si falta se busca por nombre) · ?formato=vertical abre el vertical
    si existe (clip_verticals).
  - Ya NO usa la cola de GitHub Actions (clip_edits) ni pide sesión.
  Lógica en assets/editor.js · estilos en assets/editor.css.
-->
<link rel="stylesheet" href="/assets/fonts.css" />
<link rel="stylesheet" href="/assets/estilo.css?v=20260923b" />
<link rel="stylesheet" href="/assets/app-shell.css?v=20261013" />
<link rel="stylesheet" href="/assets/editor.css?v=20261001" />
<script src="/assets/app-context.js?v=20261013"></script>
<script src="/assets/app-shell.js?v=20261013" defer></script>
<!-- Firebase ANTES de header.js (ver feed.html): si header.js no ve estas
     etiquetas inyecta otra copia de firebase-app-compat. -->
<script src="/assets/lib/firebase-9.23.0/firebase-app-compat.js" defer></script>
<script src="/assets/lib/firebase-9.23.0/firebase-firestore-compat.js" defer></script>
<script src="/assets/lib/firebase-9.23.0/firebase-auth-compat.js" defer></script>
<script src="/assets/firebase-core.js" defer></script>
<script src="/assets/auth.js?v=20260930b" defer></script>
<script src="/assets/clubs-catalog.js" defer></script>
<script src="/assets/util.js" defer></script>
<script src="/assets/vertical.js?v=20260930b" defer></script>
<script src="/assets/editor.js?v=20261001" defer></script>
</head>
<body class="pz-app pz-editor">
<div id="nav-root" data-nav-variant="app"></div>
<script src="/assets/header.js?v=20261013"></script>

<main class="ed" id="ed" aria-label="Recortar clip">
  <!-- Barra superior del editor -->
  <div class="ed-top">
    <button type="button" class="ed-cancel" id="edCancel">Cancelar</button>
    <div class="ed-title">
      <b>Recortar clip</b>
      <span id="edSub"></span>
    </div>
    <span class="ed-top-spacer" aria-hidden="true"></span>
  </div>

  <!-- Video: reproduce SOLO la selección, en bucle -->
  <div class="ed-stage" id="edStage">
   <div class="ed-frame" id="edFrame">
    <video id="edVideo" playsinline muted preload="auto" disablepictureinpicture></video>
    <button type="button" class="ed-tap" id="edTap" aria-label="Reproducir / pausar"></button>
    <span class="ed-bigplay" id="edBigPlay" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="30" height="30"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
    </span>
    <button type="button" class="ed-sound" id="edSound" aria-label="Activar sonido" aria-pressed="false">
      <svg class="ico-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      <svg class="ico-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.3 6.5a8 8 0 0 1 0 11"/></svg>
    </button>
    <div class="ed-loading" id="edLoading"><span class="ed-spin" aria-hidden="true"></span><span id="edLoadingTxt">Cargando clip…</span></div>
   </div>
  </div>

  <!-- Tiempos de la selección -->
  <div class="ed-times" aria-live="polite">
    <span class="ed-dur" id="edDur">0:00</span>
    <span class="ed-range" id="edRange">0:00 – 0:00</span>
    <span class="ed-note" id="edNote">El inicio se ajusta ±1 s</span>
  </div>

  <!-- Barra de miniaturas con dos manijas -->
  <div class="ed-tl" id="edTl">
    <div class="ed-tl-track" id="edTrack">
      <div class="ed-thumbs" id="edThumbs"></div>
      <div class="ed-dim ed-dim-l" id="edDimL"></div>
      <div class="ed-dim ed-dim-r" id="edDimR"></div>
      <div class="ed-sel" id="edSel">
        <div class="ed-sel-body" id="edSelBody" aria-hidden="true"></div>
        <div class="ed-h ed-h-l" id="edHL" role="slider" tabindex="0" aria-label="Inicio del recorte"><i></i></div>
        <div class="ed-h ed-h-r" id="edHR" role="slider" tabindex="0" aria-label="Fin del recorte"><i></i></div>
      </div>
      <div class="ed-ph" id="edPh" aria-hidden="true"></div>
    </div>
  </div>

  <!-- Fichas -->
  <div class="ed-chips">
    <div class="ed-seg" role="group" aria-label="Formato" id="edFmt">
      <button type="button" class="ed-seg-op is-on" data-fmt="h" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="2.5" y="6.5" width="19" height="11" rx="2.5"/></svg>
        Horizontal
      </button>
      <button type="button" class="ed-seg-op" data-fmt="v" aria-pressed="false" disabled title="Este clip todavía no tiene versión vertical">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/></svg>
        Vertical
      </button>
    </div>
    <button type="button" class="ed-chip" id="edMute" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      Sin sonido
    </button>
  </div>

  <!-- Acción principal -->
  <div class="ed-actions">
    <button type="button" class="ed-main" id="edExport" disabled>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/></svg>
      <span>Descargar clip</span>
    </button>
  </div>

  <!-- Sin soporte / error: descargar el clip completo -->
  <div class="ed-fallback" id="edFallback" hidden>
    <p id="edFallbackTxt">Tu navegador no puede recortar aquí.</p>
    <button type="button" class="ed-main ed-main--alt" id="edFull">Descargar el clip completo</button>
  </div>
</main>

<!-- Hoja de exportación: progreso → listo (Compartir / Guardar) -->
<div class="ed-sheet-bg" id="edSheetBg" hidden></div>
<section class="ed-sheet" id="edSheet" role="dialog" aria-modal="true" aria-labelledby="edSheetT" hidden>
  <div class="ed-sheet-grab" aria-hidden="true"></div>
  <div class="ed-step" id="edStepWork">
    <h2 class="ed-sheet-t" id="edSheetT">Preparando tu clip</h2>
    <p class="ed-sheet-s" id="edWorkSub">Bajando solo el tramo elegido…</p>
    <div class="ed-prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="edProg"><i id="edProgBar"></i></div>
    <div class="ed-prog-n" id="edProgN">0%</div>
    <button type="button" class="ed-btn2" id="edWorkCancel">Cancelar</button>
  </div>
  <div class="ed-step" id="edStepDone" hidden>
    <div class="ed-ok" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h2 class="ed-sheet-t" id="edDoneT">Tu clip está listo</h2>
    <p class="ed-sheet-s" id="edDoneS"></p>
    <button type="button" class="ed-main" id="edShare">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5M7.5 8L12 3.5 16.5 8M5 12.5v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
      <span>Compartir</span>
    </button>
    <button type="button" class="ed-main ed-main--alt" id="edSave">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/></svg>
      <span>Guardar en el teléfono</span>
    </button>
    <button type="button" class="ed-btn2" id="edBack">Seguir editando</button>
  </div>
</section>

<div class="ed-toast" id="edToast" role="status" aria-live="polite" hidden></div>
</body>
</html>
