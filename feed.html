<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<title>Verticales · Puntazo</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/favicon.ico" />

<!--
  (2026-09-29) Feed de VERTICALES estilo Reels, a pedido de Isaac.
  Fuente: Firestore clip_verticals (lo escribe la NUC, hoy solo BreakPoint).
  - Se desliza hacia arriba, se reproduce solo (sin sonido; un toque lo
    activa) y al terminar pasa al siguiente.
  - Si la NUC marca el inicio del punto (campo `inicio_punto_s`) el video
    arranca ahí; si publica una versión ligera solo del punto (`url_feed`),
    se usa esa. Mientras no existan, se ve el vertical completo.
  - Los videos solo cargan cerca de la pantalla y se sueltan al alejarse
    (los verticales completos pesan ~40 MB).
-->
<style>
  :root { --feed-top: calc(var(--pz-hdr-h, 60px) + var(--pz-safe-top, 0px)); --feed-bot: calc(var(--pz-tab-h, 64px) + var(--pz-safe-bottom, 0px)); }
  html, body { background: #000; }
  body.pz-app { padding-bottom: 0; }
  .feed {
    position: fixed; left: 0; right: 0; top: var(--feed-top); bottom: var(--feed-bot);
    overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain;
    scrollbar-width: none; background: #000;
    padding: 0; margin: 0; max-width: none; /* estilo.css le da padding a todo <main> */
  }
  .feed::-webkit-scrollbar { display: none; }
  .reel { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .reel video { width: 100%; height: 100%; object-fit: cover; background: #05070d; }
  .reel-info {
    position: absolute; left: 14px; right: 80px; bottom: 16px; z-index: 2; color: #fff;
    text-shadow: 0 1px 8px rgba(0,0,0,.7); pointer-events: none;
  }
  .reel-when { font-size: 1.35rem; font-weight: 900; letter-spacing: -.4px; line-height: 1.1; }
  .reel-where { font-size: .82rem; font-weight: 700; opacity: .85; margin-top: 2px; }
  .reel-tag { display: inline-block; margin-top: 8px; font-size: .68rem; font-weight: 900; letter-spacing: .5px; padding: 3px 9px; border-radius: 999px; background: #c8e835; color: #0b1018; text-shadow: none; }
  .reel-rail { position: absolute; right: 10px; bottom: 16px; z-index: 2; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .reel-rail .action-pill { width: 46px; height: 46px; background: rgba(0,0,0,.45); border-color: rgba(255,255,255,.25); color: #fff; }
  .reel-rail a.rail-full { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.25); color: #fff; }
  .reel-shade { position: absolute; inset: auto 0 0 0; height: 40%; background: linear-gradient(180deg, transparent, rgba(0,0,0,.65)); pointer-events: none; z-index: 1; }
  .reel-sound { position: absolute; top: 14px; right: 14px; z-index: 2; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.25); color: #fff; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .reel-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.15); z-index: 3; }
  .reel-bar div { height: 100%; width: 0; background: #c8e835; }
  .reel-next { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); z-index: 3; padding: 8px 14px; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; font-size: .8rem; font-weight: 800; display: none; }
  .feed-msg { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; padding: 24px; color: rgba(234,242,255,.75); font-weight: 600; }
  .feed-msg strong { color: #fff; font-size: 1.15rem; }
  .feed-msg a { color: #3395FF; text-decoration: none; font-weight: 800; }
  .sk { width: 100%; height: 100%; background: linear-gradient(90deg, #080c16, #111a2e, #080c16); background-size: 200% 100%; animation: sk 1.2s infinite; }
  @keyframes sk { to { background-position: -200% 0; } }
  @media (min-width: 1024px) {
    .feed { left: var(--pz-side-w, 228px); bottom: 0; top: var(--feed-top); }
    .reel { padding: 16px 0; }
    .reel video { width: auto; height: 100%; aspect-ratio: 9 / 16; border-radius: 16px; object-fit: cover; }
    .reel-info { left: calc(50% - 26vh + 14px); right: auto; max-width: 30vh; }
    .reel-rail { right: calc(50% - 26vh - 70px); }
    .reel-sound { right: calc(50% - 26vh + 14px); top: 30px; }
    .reel-shade, .reel-bar { display: none; }
  }
</style>
</head>
<body class="pz-app">
<div id="nav-root" data-nav-variant="app"></div>
<script src="/assets/header.js?v=20260930"></script>

<main class="feed" id="feed" aria-label="Verticales del club">
  <section class="reel"><div class="sk"></div></section>
</main>

<script src="/assets/lib/firebase-9.23.0/firebase-app-compat.js" defer></script>
<script src="/assets/lib/firebase-9.23.0/firebase-firestore-compat.js" defer></script>
<script src="/assets/lib/firebase-9.23.0/firebase-auth-compat.js" defer></script>
<script src="/assets/firebase-core.js" defer></script>
<script src="/assets/auth.js?v=20260930" defer></script>
<script src="/assets/clubs-catalog.js" defer></script>
<script src="/assets/vertical.js?v=20260923b" defer></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var C = window.PuntazoContext;
  var $feed = document.getElementById("feed");
  var club = (C && C.club()) || "";
  var muted = true;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function msg(html) { $feed.innerHTML = '<section class="reel"><div class="feed-msg">' + html + "</div></section>"; }
  function track(n, p) { try { window.gtag && gtag("event", n, p || {}); } catch (_) {} }

  var SOUND_ON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
  var SOUND_OFF = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m23 9-6 6M17 9l6 6"/></svg>';
  var FULL = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg>';

  async function cargar() {
    var db = null;
    try { db = PuntazoFirebase.db(); } catch (_) {}
    if (!db) return msg("<strong>No pudimos cargar los verticales</strong><span>Revisa tu conexión.</span><a href=''>Reintentar</a>");
    var docs = [];
    try {
      // Los más nuevos primero. (Sin filtro por club en la consulta para no
      // necesitar un índice compuesto: se filtra aquí.)
      var snap = await Promise.race([
        db.collection("clip_verticals").orderBy("creado", "desc").limit(80).get(),
        new Promise(function (_, rej) { setTimeout(function () { rej(new Error("timeout")); }, 10000); })
      ]);
      snap.forEach(function (d) { var x = d.data() || {}; x.id = d.id; if (x.url || x.url_feed) docs.push(x); });
    } catch (e) {
      console.warn("[feed]", e);
      return msg("<strong>No pudimos cargar los verticales</strong><span>Revisa tu conexión.</span><a href=''>Reintentar</a>");
    }
    var delClub = club ? docs.filter(function (x) { return x.club === club; }) : docs;
    var otros = false;
    if (!delClub.length && docs.length) { delClub = docs; otros = true; }
    if (!delClub.length) return msg("<strong>Aún no hay verticales</strong><span>Cuando el club los publique, aparecen aquí.</span>");
    pintar(delClub.slice(0, 40), otros);
  }

  function nombreDe(x) { return x.nombre || (x.id + ".mp4"); }
  function srcDe(x) {
    if (x.url_feed) return C.directUrl(x.url_feed);   // versión ligera del punto (NUC)
    var s = C.directUrl(x.url);
    var t = Number(x.inicio_punto_s);
    return t > 0 ? s + "#t=" + t.toFixed(1) : s;
  }

  function pintar(lista, otros) {
    $feed.innerHTML = "";
    lista.forEach(function (x, i) {
      var nombre = nombreDe(x);
      var d = C.dateFromName(nombre);
      var sec = document.createElement("section");
      sec.className = "reel";
      sec.dataset.i = i;
      sec._x = x;
      sec.innerHTML =
        '<video playsinline muted preload="none"></video>' +
        '<div class="reel-shade"></div>' +
        '<div class="reel-sound">' + SOUND_OFF + "</div>" +
        '<div class="reel-info"><div class="reel-when">' + (d ? esc(C.diaLabel(d)) + " · " + C.horaLabel(d) : "") + "</div>" +
          '<div class="reel-where">' + esc([x.club === "BreakPoint" ? "BreakPoint" : (x.club || ""), x.cancha ? C.canchaLabel(x.cancha) : ""].filter(Boolean).join(" · ")) + "</div>" +
          (Number(x.inicio_punto_s) > 0 || x.url_feed ? '<span class="reel-tag">EL PUNTO</span>' : "") + "</div>" +
        '<div class="reel-rail"></div>' +
        '<div class="reel-next">Siguiente…</div>' +
        '<div class="reel-bar"><div></div></div>';
      var rail = sec.querySelector(".reel-rail");
      if (C.linkPill) rail.appendChild(C.linkPill(nombre));
      if (window.PuntazoVertical) {
        try { rail.appendChild(PuntazoVertical.crearPill({ nombre: nombre, loc: x.club, can: x.cancha, lado: x.lado || "LadoA" }, {})); } catch (_) {}
      }
      var full = document.createElement("a");
      full.className = "rail-full"; full.href = "/clip.html?v=" + encodeURIComponent(nombre);
      full.title = "Ver clip completo"; full.setAttribute("aria-label", "Ver clip completo"); full.innerHTML = FULL;
      rail.appendChild(full);

      var v = sec.querySelector("video");
      var bar = sec.querySelector(".reel-bar div");
      v.addEventListener("timeupdate", function () {
        var t0 = x.url_feed ? 0 : (Number(x.inicio_punto_s) || 0);
        var dur = (v.duration || Number(x.duracion_s) || 1) - t0;
        bar.style.width = Math.min(100, Math.max(0, (v.currentTime - t0) / dur * 100)) + "%";
      });
      // Reproducción continua: al terminar, al siguiente.
      v.addEventListener("ended", function () {
        var sig = sec.nextElementSibling;
        if (!sig) return;
        var n = sec.querySelector(".reel-next"); n.style.display = "block";
        setTimeout(function () { n.style.display = "none"; sig.scrollIntoView({ behavior: "smooth" }); }, 900);
        track("feed_auto_siguiente", { video_name: nombre });
      });
      // Un toque: sonido sí / no (para todos).
      v.addEventListener("click", function () {
        muted = !muted;
        document.querySelectorAll(".reel video").forEach(function (o) { o.muted = muted; });
        document.querySelectorAll(".reel-sound").forEach(function (o) { o.innerHTML = muted ? SOUND_OFF : SOUND_ON; });
        if (v.paused) v.play().catch(function () {});
      });
      $feed.appendChild(sec);
    });
    if (otros) {
      var aviso = document.createElement("section");
      aviso.className = "reel";
      aviso.innerHTML = '<div class="feed-msg"><strong>Eso es todo por ahora</strong><span>Los verticales de tu club aparecerán aquí.</span></div>';
      $feed.appendChild(aviso);
    }
    observar();
  }

  // Solo el video visible suena/corre; los cercanos precargan; los lejanos se sueltan.
  function observar() {
    var reels = Array.prototype.slice.call($feed.querySelectorAll(".reel"));
    function cargarSrc(sec) {
      var v = sec.querySelector("video");
      if (v && !v.getAttribute("src") && sec._x) { v.src = srcDe(sec._x); v.preload = "metadata"; }
    }
    function soltar(sec) {
      var v = sec.querySelector("video");
      if (v && v.getAttribute("src")) { v.pause(); v.removeAttribute("src"); v.load(); }
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        var sec = en.target, v = sec.querySelector("video");
        var i = +sec.dataset.i;
        if (en.isIntersecting && en.intersectionRatio > 0.6) {
          cargarSrc(sec);
          v.muted = muted;
          v.play().catch(function () {});
          track("feed_ver", { video_name: sec._x && nombreDe(sec._x) });
          reels.forEach(function (o) {
            var j = +o.dataset.i;
            if (isNaN(j)) return;
            if (j === i + 1) cargarSrc(o);          // precarga el siguiente
            else if (Math.abs(j - i) > 2) soltar(o); // libera memoria/datos
          });
        } else if (v && !v.paused) {
          v.pause();
        }
      });
    }, { root: $feed, threshold: [0, 0.6] });
    reels.forEach(function (r) { if (r.querySelector("video")) io.observe(r); });
  }

  cargar();
});
</script>
</body>
</html>
